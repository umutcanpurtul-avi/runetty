name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Floor and above: distributions where a native build is supported.
  native:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-24.04
            image: ubuntu:24.04
          - name: debian-trixie
            image: debian:trixie
          - name: archlinux
            image: archlinux:latest
    container: ${{ matrix.image }}
    name: native (${{ matrix.name }})
    steps:
      - name: Install checkout tools
        run: |
          set -eux
          if command -v pacman >/dev/null; then
            pacman -Sy --noconfirm --needed git curl
          else
            apt-get update
            apt-get install -y --no-install-recommends git curl ca-certificates sudo
          fi
      - uses: actions/checkout@v7
      - name: Dependencies
        run: ./build-aux/install-deps.sh

      # install-deps.sh deliberately leaves rustc to rustup on Debian and
      # Ubuntu, whose packaged toolchain is far below the 1.92 gtk4-sys needs.
      # Arch ships a current one, so this is a no-op there.
      - name: Rust toolchain
        run: |
          set -eux
          if ! command -v cargo >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain stable --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: Build
        run: cargo build --release --locked
      - name: Build without terminal
        run: cargo build --release --locked --no-default-features

  # Known vulnerabilities in the dependency tree, from the RustSec database.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Cheap checks that catch packaging mistakes before a Flathub reviewer does.
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends appstream desktop-file-utils

      - name: AppStream metainfo
        run: appstreamcli validate data/dev.runetty.Runetty.metainfo.xml

      - name: Desktop entry
        run: desktop-file-validate data/dev.runetty.Runetty.desktop

      - name: Manifests agree
        run: ./build-aux/check-manifests.sh

  # Distributions below the floor are covered by Flatpak.
  flatpak:
    runs-on: ubuntu-latest
    container:
      # Renamed upstream; the old bilelmoussaoui image no longer resolves.
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      - name: Generate cargo-sources.json
        run: |
          set -eux
          python3 -m pip install --break-system-packages aiohttp toml tomlkit ||
            python3 -m pip install aiohttp toml tomlkit
          curl -sSLO https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py
          python3 flatpak-cargo-generator.py Cargo.lock -o build-aux/cargo-sources.json

      # Builds without exporting to an ostree repo. The export is what filled
      # the runner's disk, and a bundle is a release artefact rather than
      # something every push needs: what CI has to answer is whether the
      # manifest still builds.
      - name: Build
        run: |
          set -eux
          flatpak remote-add --if-not-exists --user flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            --install-deps-from=flathub \
            flatpak-build build-aux/dev.runetty.Runetty.yaml
