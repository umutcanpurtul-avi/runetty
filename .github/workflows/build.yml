name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Floor and above: distributions where a native build is supported.
  native:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-24.04
            image: ubuntu:24.04
          - name: debian-trixie
            image: debian:trixie
          - name: archlinux
            image: archlinux:latest
    container: ${{ matrix.image }}
    name: native (${{ matrix.name }})
    steps:
      - name: Install checkout tools
        run: |
          set -eux
          if command -v pacman >/dev/null; then
            pacman -Sy --noconfirm --needed git
          else
            apt-get update && apt-get install -y --no-install-recommends git ca-certificates sudo
          fi
      - uses: actions/checkout@v4
      - name: Dependencies
        run: ./build-aux/install-deps.sh
      - name: Build
        run: cargo build --release --locked
      - name: Build without terminal
        run: cargo build --release --locked --no-default-features

  # Distributions below the floor are covered by Flatpak.
  flatpak:
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:gnome-48
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Generate cargo-sources.json
        run: |
          set -eux
          python3 -m pip install --break-system-packages aiohttp toml tomlkit ||
            python3 -m pip install aiohttp toml tomlkit
          curl -sSLO https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py
          python3 flatpak-cargo-generator.py Cargo.lock -o build-aux/cargo-sources.json
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: runetty.flatpak
          manifest-path: build-aux/dev.runetty.Runetty.yaml
          cache-key: flatpak-builder-${{ github.sha }}
