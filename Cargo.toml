[package]
name = "runetty"
version = "0.3.0"
edition = "2021"
rust-version = "1.92"
description = "SSH session manager and terminal for Linux"
license = "MIT"
repository = "https://github.com/umutcanpurtul-avi/runetty"

# Taban: Ubuntu 24.04 LTS (GTK 4.14 / libadwaita 1.5 / VTE 0.76).
# Daha eskisi (Debian 12, Rocky 9, Ubuntu 22.04) Flatpak ile desteklenir.
# Ayrintilar: BUILDING.md
[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
vte = { package = "vte4", version = "0.10", features = ["v0_76"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.0.7"
dirs = "7.0.0"
libsecret = "0.9.0"
nucleo-matcher = "0.3.1"

[features]
default = ["terminal"]
# VTE'siz derleme: vte-2.91-gtk4 paketi olmayan dagitimlarda kabugu derleyebilmek icin.
terminal = ["dep:vte"]

[build-dependencies]
glib-build-tools = "0.21"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
